<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Water Droplets</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #1a2a3a 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #instructions {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #aaddff;
            font-size: 1.2rem;
            pointer-events: none;
            user-select: none;
            letter-spacing: 2px;
            text-shadow: 0px 2px 5px rgba(0,0,0,1);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="instructions">Click anywhere to scatter the rain!</div>
    
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting (Crucial for making it look like water)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(10, 10, 10);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xaaddff, 0.6);
        dirLight2.position.set(-10, -10, -10);
        scene.add(dirLight2);

        const pointLight = new THREE.PointLight(0x00aaff, 1, 30);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // 3. Create Water Material
        // MeshPhysicalMaterial gives a shiny, glass/water-like appearance
        const waterMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x88ccff,
            metalness: 0.1,
            roughness: 0.05,
            transmission: 0.9, // glass-like transparency
            opacity: 1,
            transparent: true,
            ior: 1.33, // Index of refraction for water
            thickness: 0.5
        });

        // 4. Generate Droplets
        const dropletsGroup = new THREE.Group();
        scene.add(dropletsGroup);

        const dropletGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const droplets = [];
        const particleCount = 600; // Number of small droplets

        for (let i = 0; i < particleCount; i++) {
            const mesh = new THREE.Mesh(dropletGeo, waterMaterial);
            
            // --- Calculate ASSEMBLED position (Giant sphere/drop) ---
            // Random distribution inside a sphere using spherical coordinates
            const radius = 3 * Math.cbrt(Math.random()); 
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            
            const assembledX = radius * Math.sin(phi) * Math.cos(theta);
            const assembledY = radius * Math.sin(phi) * Math.sin(theta);
            const assembledZ = radius * Math.cos(phi);
            const assembledPos = new THREE.Vector3(assembledX, assembledY, assembledZ);

            // --- Calculate SCATTERED position (Rain shower/splatter) ---
            // Wide cylindrical spread, falling downwards
            const scatterAngle = Math.random() * Math.PI * 2;
            const scatterRadius = 2 + Math.random() * 15;
            const scatterX = Math.cos(scatterAngle) * scatterRadius;
            const scatterZ = Math.sin(scatterAngle) * scatterRadius;
            const scatterY = 5 - Math.random() * 20; // Spread vertically
            
            const scatteredPos = new THREE.Vector3(scatterX, scatterY, scatterZ);

            // Initialize position at assembled state
            mesh.position.copy(assembledPos);

            // Store data for animation
            mesh.userData = {
                assembledPos: assembledPos,
                scatteredPos: scatteredPos,
                speed: 0.015 + Math.random() * 0.03, // Unique speed per droplet
                wobbleOffset: Math.random() * Math.PI * 2 // For organic floating
            };

            dropletsGroup.add(mesh);
            droplets.push(mesh);
        }

        // 5. Interaction State
        let isAssembled = true;

        window.addEventListener('click', () => {
            isAssembled = !isAssembled;
            const text = document.getElementById('instructions');
            if (isAssembled) {
                text.innerText = "Click anywhere to scatter the rain!";
            } else {
                text.innerText = "Click anywhere to reform the water drop!";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Gently rotate the whole group
            dropletsGroup.rotation.y = time * 0.1;
            dropletsGroup.rotation.z = Math.sin(time * 0.2) * 0.05;

            // Animate individual droplets
            droplets.forEach(droplet => {
                const data = droplet.userData;
                let targetPos = new THREE.Vector3();

                if (isAssembled) {
                    // When assembled, add a slight organic wobble to look like liquid
                    targetPos.copy(data.assembledPos);
                    targetPos.x += Math.sin(time * 2 + data.wobbleOffset) * 0.05;
                    targetPos.y += Math.cos(time * 2 + data.wobbleOffset) * 0.05;
                    targetPos.z += Math.sin(time * 1.5 + data.wobbleOffset) * 0.05;
                } else {
                    targetPos.copy(data.scatteredPos);
                    // Add slight downward movement simulation when scattered
                    targetPos.y -= Math.sin(time + data.wobbleOffset) * 0.2; 
                }
                
                // Lerp towards target for smooth transition
                droplet.position.lerp(targetPos, data.speed);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
