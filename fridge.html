<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twisha Family Bespoke Fridge - 3D Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #232228 0%, #111014 100%);
            font-family: 'Montserrat', sans-serif;
            color: #f7f4ed;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Chic Designer UI */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 40px;
        }
        .header {
            text-align: center;
            pointer-events: auto;
        }
        .designer-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 6px;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(135deg, #fff 30%, #e0c78a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 13px;
            color: #a8a59d;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .action-bar {
            align-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            margin-bottom: 20px;
        }
        .btn-toggle {
            background: linear-gradient(135deg, #dfc07b 0%, #b8933b 100%);
            border: none;
            outline: none;
            color: #1a1712;
            padding: 14px 34px;
            border-radius: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.35);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-toggle:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #ecd394 0%, #c8a245 100%);
        }
        .hint {
            font-size: 12px;
            color: #8c8983;
            letter-spacing: 1px;
            text-align: center;
        }
        /* Menu of Twisha's favorites */
        .favorites-badge {
            position: absolute;
            left: 40px;
            bottom: 40px;
            background: rgba(26, 24, 30, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 18px 24px;
            border-radius: 16px;
            max-width: 280px;
            pointer-events: auto;
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }
        .favorites-badge.active {
            display: block;
        }
        .favorites-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            color: #e3be67;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .favorites-list {
            font-size: 12px;
            color: #d1cfc7;
            line-height: 1.8;
            padding-left: 15px;
            margin: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div class="header">
            <div class="designer-tag">Bespoke Atelier • Limited Edition</div>
            <h1>Twisha Family</h1>
            <div class="subtitle">Custom Designer Refrigeration Experience</div>
        </div>

        <div class="favorites-badge" id="favBadge">
            <div class="favorites-title">Twisha's Favorites Inside:
