<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Money Shower</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #112211 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #instructions {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #85bb65;
            font-size: 1.2rem;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            letter-spacing: 2px;
            text-shadow: 0px 2px 4px rgba(0,0,0,1);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="instructions">Click to make it rain!</div>
    
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a140a, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 15, 10);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x85bb65, 0.5, 50);
        pointLight.position.set(0, -5, 0);
        scene.add(pointLight);

        // 3. Generate a Dollar Bill Texture dynamically using HTML5 Canvas
        // This avoids needing external image files while still looking like money
        function createDollarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Base green color
            ctx.fillStyle = '#5b8754';
            ctx.fillRect(0, 0, 512, 256);

            // Inner light green border
            ctx.fillStyle = '#85bb65';
            ctx.fillRect(15, 15, 482, 226);

            // Inner dark green border (the frame)
            ctx.strokeStyle = '#3a5c34';
            ctx.lineWidth = 8;
            ctx.strokeRect(25, 25, 462, 206);

            // Center oval (like the president's portrait)
            ctx.beginPath();
            ctx.ellipse(256, 128, 70, 90, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#a3cc8c';
            ctx.fill();
            ctx.stroke();

            // Text "$100"
            ctx.fillStyle = '#2d4a27';
            ctx.font = 'bold 60px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Corner numbers
            ctx.font = 'bold 40px "Times New Roman", serif';
            ctx.fillText('100', 70, 70);
            ctx.fillText('100', 442, 70);
            ctx.fillText('100', 70, 190);
            ctx.fillText('100', 442, 190);

            return new THREE.CanvasTexture(canvas);
        }

        const moneyTexture = createDollarTexture();

        // 4. Create the Money Material and Geometry
        const moneyGeo = new THREE.BoxGeometry(2, 0.02, 1); // A flat rectangular box
        const moneyMat = new THREE.MeshPhongMaterial({ 
            color: 0xffffff,
            map: moneyTexture,
            shininess: 10
        });

        // 5. Generate the Stack of Notes
        const notesGroup = new THREE.Group();
        scene.add(notesGroup);

        const notes = [];
        const numNotes = 300; // Total number of dollar bills

        for (let i = 0; i < numNotes; i++) {
            const note = new THREE.Mesh(moneyGeo, moneyMat);
            
            // --- Calculate ASSEMBLED position (Neat stack) ---
            // Creating two stacks side-by-side to look like a thick brick of cash
            const col = i % 2 === 0 ? -1.05 : 1.05; 
            const rowHeight = Math.floor(i / 2) * 0.025; 
            const yOffset = (numNotes / 4) * 0.025; // Center the stack vertically
            
            const assembledPos = new THREE.Vector3(col, rowHeight - yOffset, 0);
            
            // Give them a very tiny random rotation to make the stack look realistic
            const assembledRot = new THREE.Euler(0, (Math.random() - 0.5) * 0.05, 0);
            const assembledQuat = new THREE.Quaternion().setFromEuler(assembledRot);

            // --- Calculate SCATTERED position (Money shower/cloud) ---
            // Spread them out randomly in a large area
            const scatterX = (Math.random() - 0.5) * 20;
            const scatterY = (Math.random() - 0.5) * 15 + 2; 
            const scatterZ = (Math.random() - 0.5) * 15;
            const scatteredPos = new THREE.Vector3(scatterX, scatterY, scatterZ);
            
            // Chaotic rotation for the scattered state
            const scatteredRot = new THREE.Euler(
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2
            );
            const scatteredQuat = new THREE.Quaternion().setFromEuler(scatteredRot);

            // Initialize position at assembled state
            note.position.copy(assembledPos);
            note.quaternion.copy(assembledQuat);

            // Store data for animation
            note.userData = {
                assembledPos: assembledPos,
                assembledQuat: assembledQuat,
                scatteredPos: scatteredPos,
                scatteredQuat: scatteredQuat,
                speed: 0.015 + Math.random() * 0.025, // Unique easing speed per note
                floatOffset: Math.random() * Math.PI * 2, // For floating organic movement
                rotationSpeed: (Math.random() - 0.5) * 0.02 // For fluttering effect
            };

            notesGroup.add(note);
            notes.push(note);
        }

        // 6. Interaction State
        let isAssembled = true;

        window.addEventListener('click', () => {
            isAssembled = !isAssembled;
            const text = document.getElementById('instructions');
            if (isAssembled) {
                text.innerText = "Click to make it rain!";
                text.style.color = "#85bb65";
            } else {
                text.innerText = "Click to collect the cash!";
                text.style.color = "#ffaa00";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Slowly rotate the entire group for a cinematic view
            notesGroup.rotation.y = Math.sin(time * 0.2) * 0.5;

            // Animate individual notes
            notes.forEach(note => {
                const data = note.userData;
                let targetPos = new THREE.Vector3();
                let targetQuat = new THREE.Quaternion();

                if (isAssembled) {
                    // Fly back to exact stack position
                    targetPos.copy(data.assembledPos);
                    targetQuat.copy(data.assembledQuat);
                } else {
                    // Go to scattered position, but add continuous floating/fluttering
                    targetPos.copy(data.scatteredPos);
                    
                    // Simulate falling and floating in the air
                    targetPos.y += Math.sin(time * 1.5 + data.floatOffset) * 0.5;
                    targetPos.x += Math.cos(time + data.floatOffset) * 0.2;

                    // Dynamically update the scattered rotation to make it spin like a falling leaf
                    const flutterEuler = new THREE.Euler().setFromQuaternion(data.scatteredQuat);
                    flutterEuler.x += data.rotationSpeed;
                    flutterEuler.y += data.rotationSpeed;
                    targetQuat.setFromEuler(flutterEuler);
                    
                    // Save the new rotation back so it continuously spins
                    data.scatteredQuat.copy(targetQuat); 
                }
                
                // Lerp towards target position for smooth transition
                note.position.lerp(targetPos, data.speed);
                // Slerp towards target rotation
                note.quaternion.slerp(targetQuat, data.speed);
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
