<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Miniature Kitchen</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none; /* Lets clicks pass through to the 3D canvas */
            z-index: 10;
        }
        .instruction-box {
            display: inline-block;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    
    <div id="ui-layer">
        <div class="instruction-box">
            <strong>🖱️ Click anywhere</strong> to make the utensils flow in anti-gravity! <br>
            <em>(Click and drag to rotate the camera, scroll to zoom)</em>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xddeeff); // Soft blue background

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 15, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        // 3. Environment (The Miniature Kitchen)
        // Floor
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Kitchen Island / Countertop
        const counterGroup = new THREE.Group();
        
        const baseGeo = new THREE.BoxGeometry(8, 3, 4);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
        const counterBase = new THREE.Mesh(baseGeo, baseMat);
        counterBase.position.y = 1.5;
        counterBase.castShadow = true;
        counterBase.receiveShadow = true;
        counterGroup.add(counterBase);

        const topGeo = new THREE.BoxGeometry(8.5, 0.2, 4.5);
        const topMat = new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.2 });
        const counterTop = new THREE.Mesh(topGeo, topMat);
        counterTop.position.y = 3.1;
        counterTop.castShadow = true;
        counterTop.receiveShadow = true;
        counterGroup.add(counterTop);

        scene.add(counterGroup);

        // 4. Utensils Generation
        const utensils = [];
        let isFlowing = false;

        // Helper: Frying Pan
        function createPan() {
            const group = new THREE.Group();
            const panMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
            
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.8, 0.3, 32), panMat);
            body.castShadow = true;
            group.add(body);
            
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 2), panMat);
            handle.position.set(0, 0, 1.5);
            handle.castShadow = true;
            group.add(handle);
            
            return group;
        }

        // Helper: Coffee Mug
        function createMug() {
            const mugMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 });
            const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.9, 32), mugMat);
            mug.castShadow = true;
            return mug;
        }

        // Helper: Plates
        function createPlate() {
            const plateMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
            const plate = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 0.8, 0.1, 32), plateMat);
            plate.castShadow = true;
            return plate;
        }

        // Helper: Kitchen Knife
        function createKnife() {
            const group = new THREE.Group();
            const blade = new THREE.Mesh(
                new THREE.BoxGeometry(0.05, 0.3, 1.5), 
                new THREE.MeshStandardMaterial({ color: 0xbdc3c7, metalness: 0.8, roughness: 0.2 })
            );
            blade.position.z = 0.5;
            blade.castShadow = true;
            group.add(blade);

            const handle = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.2, 0.8), 
                new THREE.MeshStandardMaterial({ color: 0x8e44ad })
            );
            handle.position.z = -0.5;
            handle.castShadow = true;
            group.add(handle);

            return group;
        }

        // Place Utensils on Counter
        function addUtensil(mesh, x, z) {
            // Find resting Y dynamically based on countertop height
            const startY = 3.2 + (mesh.geometry ? mesh.geometry.parameters.height/2 : 0.15); 
            mesh.position.set(x, startY, z);
            scene.add(mesh);
            
            // Store properties for the flowing animation
            utensils.push({
                mesh: mesh,
                startY: startY,
                randomSpeed: Math.random() * 0.02 + 0.01,
                timeOffset: Math.random() * Math.PI * 2,
                floatHeight: Math.random() * 3 + 2
            });
        }

        addUtensil(createPan(), -2, 0);
        addUtensil(createMug(), 2, 0.5);
        addUtensil(createMug(), 3, -0.5);
        
        const plate1 = createPlate();
        const plate2 = createPlate();
        addUtensil(plate1, 0, 0);
        addUtensil(plate2, 0, 0); 
        plate2.position.y += 0.15; // Stack the second plate
        utensils[utensils.length-1].startY += 0.15;

        const knife = createKnife();
        knife.rotation.y = Math.PI / 4;
        addUtensil(knife, -3, 1);

        // 5. Interaction Logic
        window.addEventListener('click', () => {
            isFlowing = !isFlowing;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const time = clock.getElapsedTime();

            utensils.forEach((u) => {
                if (isFlowing) {
                    // Anti-gravity floating and flowing mechanics
                    const targetY = u.startY + u.floatHeight + Math.sin(time * 2 + u.timeOffset) * 0.8;
                    
                    // Smoothly transition up
                    u.mesh.position.y += (targetY - u.mesh.position.y) * 0.05;
                    
                    // Gentle rotation while flowing
                    u.mesh.rotation.x += u.randomSpeed;
                    u.mesh.rotation.y += u.randomSpeed;
                    u.mesh.rotation.z += u.randomSpeed * 0.5;

                } else {
                    // Gravity returns - fall back to table
                    u.mesh.position.y += (u.startY - u.mesh.position.y) * 0.1;
                    
                    // Smoothly reset rotation to rest flat on the counter
                    u.mesh.rotation.x += (0 - u.mesh.rotation.x) * 0.1;
                    
                    // For the knife, we want to keep its original Y rotation, for others reset to 0
                    if(u.mesh.children.length === 2 && u.mesh.children[0].geometry.type === "BoxGeometry" && u.mesh.children[1].geometry.type === "BoxGeometry") {
                        // Knife check
                        u.mesh.rotation.y += (Math.PI / 4 - u.mesh.rotation.y) * 0.1;
                    } else {
                        u.mesh.rotation.y += (0 - u.mesh.rotation.y) * 0.1;
                    }
                    u.mesh.rotation.z += (0 - u.mesh.rotation.z) * 0.1;
                }
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
