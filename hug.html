<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hugging Couple</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #2c3e50; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #info {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #ecf0f1;
            font-size: 1.2rem;
            pointer-events: none;
            user-select: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="info">Click anywhere to separate / hug!</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Set up scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // 3. Helper function to create a stylized "person"
        function createPerson(bodyColor) {
            const group = new THREE.Group();

            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
            const bodyMat = new THREE.MeshPhongMaterial({ color: bodyColor });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.4, 32, 32);
            const headMat = new THREE.MeshPhongMaterial({ color: 0xffccaa }); // Skin tone
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.4;
            group.add(head);

            // Arms (A semi-circle to simulate wrapping arms around)
            const armGeo = new THREE.TorusGeometry(0.6, 0.12, 16, 32, Math.PI);
            const armMat = new THREE.MeshPhongMaterial({ color: bodyColor });
            const arms = new THREE.Mesh(armGeo, armMat);
            arms.position.y = 1.3;
            arms.rotation.x = Math.PI / 2;
            group.add(arms);

            return group;
        }

        // 4. Create the Couple
        const person1 = createPerson(0x3498db); // Blue character
        const person2 = createPerson(0xe74c3c); // Red character
        scene.add(person1);
        scene.add(person2);

        // 5. Define Animation States
        let isHugging = true;

        // Coordinates and rotations for hugging
        const hugPos1 = { x: -0.4, z: 0.2, rotY: Math.PI / 5, rotZ: 0.1 };
        const hugPos2 = { x: 0.4, z: -0.2, rotY: -Math.PI / 5, rotZ: -0.1 };
        
        // Coordinates and rotations for separated state
        const sepPos1 = { x: -2, z: 0, rotY: 0, rotZ: 0 };
        const sepPos2 = { x: 2, z: 0, rotY: 0, rotZ: 0 };

        // Set initial positions to hugging
        person1.position.set(hugPos1.x, 0, hugPos1.z);
        person1.rotation.set(0, hugPos1.rotY, hugPos1.rotZ);
        
        person2.position.set(hugPos2.x, 0, hugPos2.z);
        person2.rotation.set(0, hugPos2.rotY, hugPos2.rotZ);

        camera.position.z = 7;
        camera.position.y = 2;

        // 6. Click Event Listener
        window.addEventListener('click', () => {
            isHugging = !isHugging; // Toggle state
        });

        // 7. Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. Animation Loop (Smooth interpolation using Lerp)
        function animate() {
            requestAnimationFrame(animate);

            // Determine current target based on state
            const target1 = isHugging ? hugPos1 : sepPos1;
            const target2 = isHugging ? hugPos2 : sepPos2;

            // Ease Person 1 into position
            person1.position.x += (target1.x - person1.position.x) * 0.05;
            person1.position.z += (target1.z - person1.position.z) * 0.05;
            person1.rotation.y += (target1.rotY - person1.rotation.y) * 0.05;
            person1.rotation.z += (target1.rotZ - person1.rotation.z) * 0.05;

            // Ease Person 2 into position
            person2.position.x += (target2.x - person2.position.x) * 0.05;
            person2.position.z += (target2.z - person2.position.z) * 0.05;
            person2.rotation.y += (target2.rotY - person2.rotation.y) * 0.05;
            person2.rotation.z += (target2.rotZ - person2.rotation.z) * 0.05;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
