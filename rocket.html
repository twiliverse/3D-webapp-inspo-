<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rocket Launch</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(to bottom, #020111 0%, #20124d 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #instructions {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            color: #00ffff;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            letter-spacing: 3px;
            text-shadow: 0px 0px 10px rgba(0, 255, 255, 0.8);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="instructions">MISSION CONTROL: CLICK TO LAUNCH</div>
    
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x20124d, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        const moonLight = new THREE.DirectionalLight(0xccccff, 0.8);
        moonLight.position.set(-10, 20, 10);
        scene.add(moonLight);

        // Dynamic light for the rocket engine fire
        const engineLight = new THREE.PointLight(0xff5500, 0, 20);
        scene.add(engineLight);

        // 3. Create the Environment (Stars & Planet Surface)
        
        // Stars
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1000;
        const starVertices = [];
        for(let i=0; i<starCount; i++) {
            const x = (Math.random() - 0.5) * 200;
            const y = Math.random() * 200; // Stars only above ground
            const z = (Math.random() - 0.5) * 200 - 50;
            starVertices.push(x, y, z);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // Moon/Planet Surface
        const planetGeo = new THREE.SphereGeometry(100, 64, 64);
        const planetMat = new THREE.MeshPhongMaterial({ 
            color: 0x555566, 
            flatShading: true,
            shininess: 0
        });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.position.y = -100; // Push huge sphere down to act as ground
        scene.add(planet);

        // 4. Create Launch Base
        const baseGroup = new THREE.Group();
        scene.add(baseGroup);

        // Launchpad Floor
        const padGeo = new THREE.CylinderGeometry(4, 4.5, 0.5, 16);
        const padMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const pad = new THREE.Mesh(padGeo, padMat);
        pad.position.y = 0.25;
        baseGroup.add(pad);

        // Support Tower
        const towerGeo = new THREE.BoxGeometry(0.5, 8, 0.5);
        const towerMat = new THREE.MeshPhongMaterial({ color: 0x882222 });
        const tower = new THREE.Mesh(towerGeo, towerMat);
        tower.position.set(-2, 4, 0);
        baseGroup.add(tower);

        // 5. Create the Rocket
        const rocketGroup = new THREE.Group();
        const startY = 0.5; // Resting height on the pad
        rocketGroup.position.y = startY;
        scene.add(rocketGroup);

        const rocketMat = new THREE.MeshPhongMaterial({ color: 0xeeeeee });
        const detailMat = new THREE.MeshPhongMaterial({ color: 0xdd1111 });

        // Rocket Body
        const bodyGeo = new THREE.CylinderGeometry(0.8, 0.8, 5, 32);
        const body = new THREE.Mesh(bodyGeo, rocketMat);
        body.position.y = 3;
        rocketGroup.add(body);

        // Nose Cone
        const noseGeo = new THREE.ConeGeometry(0.8, 2, 32);
        const nose = new THREE.Mesh(noseGeo, detailMat);
        nose.position.y = 6.5;
        rocketGroup.add(nose);

        // Fins
        const finGeo = new THREE.BoxGeometry(0.1, 1.5, 1.5);
        for(let i = 0; i < 4; i++) {
            const fin = new THREE.Mesh(finGeo, detailMat);
            fin.position.y = 1;
            const angle = (i / 4) * Math.PI * 2;
            fin.position.x = Math.cos(angle) * 1.2;
            fin.position.z = Math.sin(angle) * 1.2;
            fin.rotation.y = -angle;
            // Angle the fins slightly
            fin.rotation.x = 0.2; 
            rocketGroup.add(fin);
        }

        // Engine Nozzle
        const engineGeo = new THREE.CylinderGeometry(0.6, 0.4, 0.8, 16);
        const engineMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        const engine = new THREE.Mesh(engineGeo, engineMat);
        engine.position.y = 0.1;
        rocketGroup.add(engine);

        // 6. Exhaust Fire & Smoke Effects
        
        // Fire
        const fireGeo = new THREE.ConeGeometry(0.6, 3, 16);
        const fireMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.8 });
        const fire = new THREE.Mesh(fireGeo, fireMat);
        fire.position.y = -1.5;
        fire.rotation.x = Math.PI; // point downwards
        fire.visible = false;
        rocketGroup.add(fire);

        // Smoke particles at the base
        const smokeGroup = new THREE.Group();
        smokeGroup.position.y = 1;
        scene.add(smokeGroup);
        const smokeClouds = [];
        const smokeGeo = new THREE.SphereGeometry(1, 16, 16);
        const smokeMat = new THREE.MeshPhongMaterial({ color: 0x888888, transparent: true, opacity: 0.6 });
        
        for(let i=0; i<15; i++) {
            const cloud = new THREE.Mesh(smokeGeo, smokeMat);
            cloud.userData = {
                angle: Math.random() * Math.PI * 2,
                speed: 0.05 + Math.random() * 0.1,
                maxScale: 2 + Math.random() * 3
            };
            cloud.scale.set(0.1, 0.1, 0.1);
            cloud.visible = false;
            smokeGroup.add(cloud);
            smokeClouds.push(cloud);
        }

        // 7. Interaction and States
        let state = 'IDLE'; // IDLE, LAUNCHING, RESETTING
        let velocity = 0;

        window.addEventListener('click', () => {
            const text = document.getElementById('instructions');
            if (state === 'IDLE' || state === 'RESETTING') {
                state = 'LAUNCHING';
                text.innerText = "LAUNCH SEQUENCE INITIATED! (CLICK TO ABORT)";
                text.style.color = "#ff3333";
            } else if (state === 'LAUNCHING') {
                state = 'RESETTING';
                text.innerText = "ABORTING... RETURNING TO BASE";
                text.style.color = "#ffff00";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (state === 'LAUNCHING') {
                // Accelerate rocket
                velocity += 0.005;
                rocketGroup.position.y += velocity;

                // Fire effects
                fire.visible = true;
                // Flicker effect by rapidly changing scale
                fire.scale.set(
                    1 + (Math.random() - 0.5) * 0.2, 
                    1 + Math.random() * 0.5, 
                    1 + (Math.random() - 0.5) * 0.2
                );
                
                engineLight.intensity = 2 + Math.random();
                engineLight.position.copy(rocketGroup.position);
                engineLight.position.y -= 1;

                // Smoke expansion
                smokeClouds.forEach(cloud => {
                    cloud.visible = true;
                    // Expand scale
                    if (cloud.scale.x < cloud.userData.maxScale) {
                        cloud.scale.addScalar(0.1);
                    }
                    // Move outwards
                    cloud.position.x += Math.cos(cloud.userData.angle) * cloud.userData.speed;
                    cloud.position.z += Math.sin(cloud.userData.angle) * cloud.userData.speed;
                });

                // Camera follows the rocket slightly
                camera.position.y = 5 + (rocketGroup.position.y * 0.4);
                camera.lookAt(0, rocketGroup.position.y * 0.5, 0);

            } else if (state === 'RESETTING') {
                // Lerp rocket smoothly back to start
                rocketGroup.position.y += (startY - rocketGroup.position.y) * 0.05;
                velocity = 0;

                // Turn off engine
                fire.visible = false;
                engineLight.intensity = 0;

                // Reset Smoke
                smokeClouds.forEach(cloud => {
                    cloud.scale.lerp(new THREE.Vector3(0.1, 0.1, 0.1), 0.1);
                    cloud.position.lerp(new THREE.Vector3(0, 0, 0), 0.1);
                });

                // Camera resets
                camera.position.y += (5 - camera.position.y) * 0.05;
                camera.lookAt(0, 5, 0);

                // If close enough to start, switch to IDLE
                if (Math.abs(rocketGroup.position.y - startY) < 0.1) {
                    rocketGroup.position.y = startY;
                    state = 'IDLE';
                    smokeClouds.forEach(c => c.visible = false);
                    const text = document.getElementById('instructions');
                    text.innerText = "MISSION CONTROL: CLICK TO LAUNCH";
                    text.style.color = "#00ffff";
                }
            }

            // Gently rotate stars for a dynamic space feel
            stars.rotation.y -= 0.0005;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
